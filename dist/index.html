<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"></head><body><title>Làng Đồ Đá</title>
<style>
:root {
  --bg: #f1e8d5; --panel: #e8dcc2; --panel-2: #dfd0b0; --fg: #3a2c1c; --muted: #7a6850; --line: #bfa97f;
  --accent: #a4481f; --accent-fg: #fff6e8; --hud: rgba(241,232,213,.9); --ring: #6a5330; --good: #4f8a38; --bad: #b8433a;
  --game-bg: #0b0d16;
  /* everything pinned to a screen edge keeps clear of a phone's system bars */
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: 0px; --sar: 0px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1710; --panel: #2a2217; --panel-2: #342a1c; --fg: #ecdfc4; --muted: #a8977a; --line: #4d3f29;
  --accent: #e08a52; --accent-fg: #26180c; --hud: rgba(29,23,16,.9); --ring: #8a7048; --good: #7ac15c; --bad: #e0705f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1d1710; --panel: #2a2217; --panel-2: #342a1c; --fg: #ecdfc4; --muted: #a8977a; --line: #4d3f29;
  --accent: #e08a52; --accent-fg: #26180c; --hud: rgba(29,23,16,.9); --ring: #8a7048; --good: #7ac15c; --bad: #e0705f; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--game-bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.35; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: crosshair; image-rendering: pixelated; }

button { font: inherit; font-weight: 600; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.sm { padding: 2px 8px; min-height: 26px; }
@media (pointer: coarse) { button { min-height: 38px; padding: 6px 11px; } button.sm { min-height: 32px; } }

/* top bar */
.top { position: absolute; left: calc(6px + var(--sal)); right: calc(6px + var(--sar)); top: calc(6px + var(--sat)); display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; pointer-events: none; }
.top > * { pointer-events: auto; }
.hud { background: var(--hud); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; backdrop-filter: blur(2px); display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
.res { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.res i { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); display: inline-block; }
.res small { font-weight: 500; color: var(--muted); }
.res#rCoin small { display: none; }
.res.full b { color: var(--accent); }
.res.warn small { color: var(--accent); font-weight: 700; }
.clock { font-weight: 600; }
.grp { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* bottom-left sheet */
.sheet { position: absolute; left: calc(6px + var(--sal)); bottom: calc(6px + var(--sab)); width: min(440px, calc(100% - 130px)); max-height: calc(100% - var(--top-h, 44px) - 14px); overflow: auto; display: grid; gap: 6px; pointer-events: none; align-content: end; }
.sheet > * { pointer-events: auto; }
.card { background: var(--hud); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; backdrop-filter: blur(2px); display: grid; gap: 5px; }
.cardhead { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.cardhead b { font-size: 14px; }
.cardhead span { color: var(--muted); }
.cardhead .x { margin-left: auto; align-self: center; }
.kv { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: 12px; }
.kv b { color: var(--fg); font-variant-numeric: tabular-nums; }
.stars { color: var(--accent); letter-spacing: 1px; }
.bars { display: grid; grid-template-columns: repeat(5, minmax(48px, 1fr)); gap: 4px 10px; }
.bars label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
.bars i { display: block; height: 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bars i b { display: block; height: 100%; width: 0; background: var(--good); transition: width .2s; }
.bars i b.bad { background: var(--bad); }
.bars i b.mor { background: #6d8fd8; }
.bars i b.arm { background: #9aa0a4; }
.bars i b.en { background: #d8b13a; }
.bars i b.en.low { background: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 4px; }
.sub { color: var(--muted); font-size: 12px; margin: 0; }
/* guidance hides behind a "?" */
.hint { display: grid; gap: 4px; align-content: start; }
.hinthead { display: flex; align-items: center; gap: 6px; }
.hinthead > h3 { margin: 0; }
.hint .cardhead .q, .hinthead > .q:only-child { margin-left: auto; }
button.q { flex: none; width: 22px; height: 22px; min-height: 0; padding: 0; border-radius: 50%; font-size: 12px; line-height: 1; color: var(--muted); }
button.q[aria-expanded="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
@media (pointer: coarse) { button.q { width: 28px; height: 28px; min-height: 0; padding: 0; } }
.hintbody { padding: 4px 8px; border-left: 2px solid var(--accent); background: var(--panel-2); border-radius: 0 4px 4px 0; }
.nm.hint { gap: 2px; }
.nm.hint .hinthead { font-weight: 600; }
.maphint { position: absolute; left: 8px; top: 8px; max-width: min(260px, 60%); }
.maphint .hintbody { color: var(--fg); background: var(--hud); }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; padding: 2px 0; }
details.fold { border-top: 1px solid var(--line); padding-top: 2px; display: block; }
details.fold > .btns, details.fold > .kv { margin-top: 4px; }
.selbar { display: flex; gap: 4px; flex-wrap: wrap; }
.sheet.folded > .card { display: none; }

/* full-screen panels: building details, villager details */
.modal { position: fixed; inset: 0; z-index: 42; background: var(--bg); display: flex; flex-direction: column; padding: var(--sat) var(--sar) var(--sab) var(--sal); }
.modal[hidden] { display: none; }
.modal > .cardhead { padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; flex-wrap: nowrap; }
.modal > .cardhead b { font-size: 16px; }
.modal > .cardhead span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.modal > .cardhead .x { flex: none; }
/* the war tent's full-screen planning view: a map to drag and zoom, with the squads and the plan on a board beside it */
.planfull .pstage { position: relative; flex: 1; min-height: 0; display: flex; background: #1a1510; }
.pview { position: relative; flex: 1; min-width: 0; overflow: hidden; color: #ecdfc4; --fg: #ecdfc4; --muted: #b8a888; --panel: rgba(26,20,13,.93); --panel-2: rgba(58,45,30,.92); --line: rgba(255,255,255,.2); --accent: #e0b43c; }
.pview .sub, .pview small { color: #c9bb9a; }
.chip { font: inherit; font-size: 13px; font-weight: 600; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; min-height: 28px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
.chip:hover:not([disabled]) { border-color: var(--accent); }
.chip.on { background: var(--accent); color: #1a1208; border-color: transparent; }
.chip.danger { border-color: #d9534f; color: #ffb4a8; }
.chip.danger.on { background: #d9534f; color: #fff; }
.chip[disabled] { opacity: .4; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pcard { position: absolute; right: 10px; top: 10px; z-index: 3; width: min(340px, calc(100% - 20px)); max-height: calc(100% - 90px); overflow: auto; display: grid; gap: 6px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
.pcard[hidden] { display: none; }
.psec { display: grid; gap: 4px; }
.ptitle { text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.phead { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.phead i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #1a1208; flex: none; }
.phead small { flex: 1; min-width: 0; }
.pdesc { margin: 0; padding: 8px 10px; background: rgba(255,255,255,.07); border-left: 3px solid var(--accent); border-radius: 4px; font-size: 13px; line-height: 1.45; }
.rrow { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; padding: 2px 4px 2px 8px; background: var(--panel-2); border-radius: 3px; }
.rwho { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.rwho b { flex: none; max-width: 55%; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rwho small { min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .chip { width: 26px; min-height: 26px; padding: 0; border-radius: 3px; }
.proster { gap: 4px; }
.proster > .chip { justify-self: start; }
.rdrop { display: grid; gap: 0; max-height: 180px; overflow: auto; padding: 2px; background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 3px; }
.rpick { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; padding: 3px 6px; border-radius: 2px; cursor: pointer; }
.rpick:hover { background: rgba(255,255,255,.08); }
.rpick input { width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
.pbar { display: grid; gap: 6px; }
.psteps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pdot { width: 28px; height: 28px; min-height: 28px; padding: 0; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-size: 12px; font-weight: 800; cursor: pointer; }
.pdot.done { border-color: var(--accent); color: var(--accent); }
.pdot.now { background: var(--accent); color: #1a1208; border-color: transparent; }
.pstep { display: flex; justify-content: space-between; align-items: baseline; }
.pstep b { font-size: 16px; }
.pbody2 { display: grid; gap: 8px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-areas: "i t" "i n"; column-gap: 8px; row-gap: 0; align-items: center; text-align: left; padding: 9px 10px; min-height: 62px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; color: var(--fg); cursor: pointer; }
.opt .oi { grid-area: i; font-size: 24px; line-height: 1; width: 30px; text-align: center; }
.opt b { grid-area: t; font-size: 13px; }
.opt small { grid-area: n; font-size: 11px; line-height: 1.25; }
.opts.three .opt { grid-template-columns: 1fr; grid-template-areas: "i" "t" "n"; justify-items: center; text-align: center; min-height: 66px; padding: 8px 4px; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt.on { border-color: var(--accent); background: rgba(224,180,60,.2); }
.opt.on::after { content: "✓"; position: absolute; right: 8px; top: 4px; color: var(--accent); font-weight: 800; }
.opt[disabled] { opacity: .4; cursor: default; }
.pnav { display: flex; justify-content: space-between; gap: 8px; }
.ov { display: grid; gap: 6px; }
.ovrow { display: grid; grid-template-columns: auto 1fr auto; grid-template-areas: "i l e" "i v e"; column-gap: 10px; align-items: center; text-align: left; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); cursor: pointer; }
.ovrow .oi { grid-area: i; font-size: 22px; }
.ovrow small { grid-area: l; }
.ovrow b { grid-area: v; font-size: 13px; }
.ovrow em { grid-area: e; font-style: normal; font-size: 12px; color: var(--accent); }
.ptray { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ptray details { flex-basis: 100%; font-size: 12px; }
.ptray summary { cursor: pointer; color: #ffd27a; }
@media (max-width: 800px) { .pcard { left: 10px; right: 10px; top: auto; bottom: calc(60px + var(--sab)); width: auto; max-height: 50%; } }
.planmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.planmap:active { cursor: grabbing; }
.pinfo { position: absolute; left: 10px; top: 10px; z-index: 2; max-width: min(360px, calc(100% - 20px)); display: grid; gap: 4px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.pinfo summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.ptools { position: absolute; left: 10px; bottom: calc(10px + var(--sab)); z-index: 2; display: flex; gap: 6px; }
.ptools .zoom { width: 40px; height: 40px; font-size: 20px; padding: 0; }
.pact { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 20px); padding: 6px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 13px; }
.pact[hidden] { display: none; }
.pnote { position: absolute; left: 50%; bottom: calc(14px + var(--sab)); transform: translateX(-50%); z-index: 2; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; width: min(560px, calc(100% - 100px)); padding: 8px 12px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.4); font-size: 13px; }
.pnote[hidden] { display: none; }
.ppop { position: absolute; z-index: 4; width: 260px; display: grid; gap: 6px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.45); }
.ppop[hidden] { display: none; }
.mbody { overflow: auto; flex: 1; padding: 10px 12px 16px; display: grid; gap: 10px; align-content: start; width: 100%; max-width: 860px; margin: 0 auto; -webkit-overflow-scrolling: touch; }
.mbody.cols { max-width: 1100px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.mbody h3 { margin: 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.mbody section { display: grid; gap: 6px; align-content: start; }
.tabpage { display: grid; gap: 6px; align-content: start; }
.tabs { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 2px 0 4px; }
.split { display: grid; grid-template-columns: minmax(200px, 1fr) minmax(240px, 1.1fr); gap: 10px; align-items: start; }
@media (max-width: 640px) { .split { grid-template-columns: 1fr; } }
.plist { display: grid; gap: 2px; }
button.vrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; text-align: left; font-weight: 400; padding: 5px 8px; min-height: 0; border-radius: 6px; }
button.vrow small { color: var(--muted); }
button.vrow.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.vrow.on small { color: var(--accent-fg); }
.ppane { position: sticky; top: 36px; display: grid; gap: 6px; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.picker { display: grid; gap: 2px; padding: 4px 8px; background: var(--panel-2); border-left: 2px solid var(--accent); border-radius: 0 4px 4px 0; }
.mbody .bars { grid-template-columns: repeat(5, 1fr); }
#ucard .open { margin-left: auto; }

/* buttons of the tapped building, floating beneath it on the map */
.bbar { position: absolute; left: 0; top: 0; z-index: 30; display: grid; gap: 4px; justify-items: center; max-width: min(94vw, 440px); padding: 5px 6px; background: var(--hud); border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(2px); will-change: transform; }
.bbar .who { font-size: 12px; color: var(--muted); text-align: center; }
.bbar .who b { color: var(--fg); font-size: 13px; }
.bbar .btns { justify-content: center; }
/* confirm dialog: upgrade and demolish */
.dialog { position: fixed; inset: 0; z-index: 48; display: grid; place-items: center; padding: 12px; background: rgba(5, 6, 12, .6); }
.dialog > .card { width: min(380px, 100%); max-height: 100%; overflow: auto; background: var(--bg); gap: 8px; padding: 10px 12px; }
.dialog h3 { margin: 0; font-size: 15px; color: var(--fg); text-transform: none; letter-spacing: 0; }
.dialog .costs { display: grid; gap: 2px; }
.dialog .costs div { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.dialog .costs .short { color: var(--bad); font-weight: 700; }
.dialog .why { color: var(--bad); font-weight: 600; margin: 0; }
.dialog .btns { justify-content: flex-end; }
button.danger { color: var(--bad); }
button.primary.danger { background: var(--bad); color: #fff; border-color: var(--bad); }

/* lists */
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .nm { font-weight: 600; }
.row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.rec { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
.rec canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.rec .qty { display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.rec.locked, .tech.locked { opacity: .55; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.tech .nm { font-weight: 600; }
.tech .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tech.done .nm { color: var(--good); }
.lock { display: block; color: var(--bad); }
button.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.rec .have { min-width: 9ch; text-align: right; color: var(--muted); font-size: 12px; }
.vrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); cursor: pointer; }
.vrow small { color: var(--muted); }
.tribe-bar { height: 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.tribe-bar b { position: absolute; top: 0; bottom: 0; background: var(--accent); }
.tribe-bar u { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--fg); left: 50%; opacity: .5; }

/* minimap, log, toast */
#mini { position: absolute; right: calc(6px + var(--sar)); bottom: calc(6px + var(--sab)); width: clamp(64px, 15vw, 96px); aspect-ratio: 1; image-rendering: pixelated; border: 2px solid var(--ring); border-radius: 6px; background: #080a14; cursor: zoom-in; }
.log { position: absolute; right: calc(6px + var(--sar)); bottom: calc(clamp(64px, 15vw, 96px) + 14px + var(--sab)); max-width: min(330px, 46%); text-align: right; font-size: 12px; line-height: 1.35; color: #f5e7c4; text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; display: grid; gap: 2px; }
.toast { position: absolute; left: 50%; top: calc(52px + var(--sat)); transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 5px 12px; border-radius: 16px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: 90%; text-align: center; z-index: 50; }
.toast.on { opacity: 1; }
#bigmap { position: fixed; inset: 0; background: rgba(5,6,12,.88); z-index: 45; display: grid; place-items: center; }
#bigmap .wrap { position: relative; width: min(94vh, 94vw); aspect-ratio: 1; }
#bigmapCanvas { width: 100%; height: 100%; image-rendering: pixelated; border: 2px solid var(--ring); border-radius: 6px; background: #080a14; cursor: crosshair; touch-action: none; }
#bigmap .close { position: absolute; right: 8px; top: 8px; }

/* ask for landscape on a phone held upright */
#rotate { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: rgba(11, 13, 22, .94); color: #f5e7c4; }
#rotate[hidden] { display: none; }
#rotate p { margin: 0; max-width: 28ch; color: #d9c9a6; }
#rotate button { min-width: 200px; }
#rotate .phone { width: 64px; height: 36px; border: 4px solid #f5e7c4; border-radius: 8px; position: relative; animation: turn 2.4s ease-in-out infinite; transform: rotate(90deg); }
#rotate .phone::after { content: ''; position: absolute; right: -2px; top: 50%; width: 3px; height: 8px; margin-top: -4px; background: #f5e7c4; }
@keyframes turn { 0%, 25% { transform: rotate(90deg); } 60%, 100% { transform: rotate(0deg); } }
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(0deg); } }

  var BUILDINGS = {

      h: 3,

    },
    // a pit of sharpened stakes, laid one at a time; hp is how many men it can still wound
    trap: {
      kind: "trap",
      name: "H\u1ED1 ch\xF4ng",
      w: 1,

      requires: ["builder"],

      levels: { stone: [lv("\u0110\u1EA5t v\u1EE1", { wood: 10 }, 70, 0, 1, 1), lv("Lu\u1ED1ng \u0111\u1EAFp", { wood: 15, stone: 5 }, 110, 0, 1.4, 1), lv("B\u1EDD \u0111\xE1", { wood: 20, stone: 15 }, 160, 0, 1.8, 1)] }
    }
  };
  function levelsOf(kind, era) {
    const defs = BUILDINGS[kind].levels;
    for (let i = ERAS.indexOf(era); i >= 0; i--) {
      const l = defs[ERAS[i]];
      if (l) return l;
    }
    return defs.stone;
  }
  var levelDef = (b, level = b.level) => levelsOf(b.kind, b.era)[level - 1];
  var maxLevel = (kind, era) => levelsOf(kind, era).length;
  var holdsGoods = (b) => b.kind === "storage" || b.kind === "campfire";
  var needsWork = (b) => !b.done || b.upgrading;
  var canGrow = (kind) => BUILDINGS[kind].buildable || !!BUILDINGS[kind].upgradable;
  var POP_BY_FIRE = [8, 16, 25, 40];
  var levelCapByFire = (fireLevel) => Math.max(1, fireLevel - 1);

  // src/sim/constants.ts
  var TILE = 32;
  var MAP_SIZE = 192;
  var VISION = 7;
  var NIGHT_VISION = 3;
  var FIRE_VISION = 8;
  var TICK = 1 / 20;
  var DAY_LENGTH = 1200;
  var START_TIME = DAY_LENGTH * 0.25;
  var gameDays = (secs) => {

  };
  var WORK_DAY = 240;
  var PACE = { work: WORK_DAY / DAY_LENGTH };
  var workDays = (workSecs) => gameDays(workSecs / PACE.work);

  // src/sim/rng.ts
  function mulberry32(seed2) {
    let a = seed2 >>> 0;
    const next = (() => {
      a = a + 1831565813 >>> 0;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    });
    next.getState = () => a;
    next.setState = (state) => {
      a = state >>> 0;
    };
    return next;
  }
  function hash2(x, y, seed2) {
    let h2 = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed2 | 0, 1274126177);
    h2 = Math.imul(h2 ^ h2 >>> 13, 1274126177);
    h2 ^= h2 >>> 16;
    return (h2 >>> 0) / 4294967296;
  }
  var smooth = (t) => t * t * (3 - 2 * t);
  function valueNoise(x, y, seed2) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    const a = hash2(ix, iy, seed2), b = hash2(ix + 1, iy, seed2);
    const c = hash2(ix, iy + 1, seed2), d = hash2(ix + 1, iy + 1, seed2);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y, seed2, octaves = 3) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let o = 0; o < octaves; o++) {
      sum += valueNoise(x * f, y * f, seed2 + o * 101) * amp;
      norm += amp;
      amp *= 0.5;
      f *= 2;
    }
    return sum / norm;
  }

  // src/sim/world.ts
  var Tile = { Grass: 0, Water: 1, Tree: 2, Rock: 3, Mud: 4, Bush: 5 };
  var NODE_INFO = {
    tree: { res: "wood", max: 10 },
    rock: { res: "stone", max: 14 },
    bush: { res: "food", max: 6 }
  };
  var TILE_OF = { tree: Tile.Tree, rock: Tile.Rock, bush: Tile.Bush };
  var World = class {
    constructor(seed2) {
      this.seed = seed2;
      this.size = MAP_SIZE;
      this.tiles = new Uint8Array(MAP_SIZE * MAP_SIZE);

      // ô bị công trình chiếm

      // 1 = gốc cây
      this.nodes = /* @__PURE__ */ new Map();
      this.start = { x: MAP_SIZE >> 1, y: MAP_SIZE >> 1 };
      this.season = "spring";
      const N = this.size;
      for (let y = 0; y < N; y++) {
