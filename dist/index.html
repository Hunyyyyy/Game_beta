<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"></head><body><title>Làng Đồ Đá</title>
<style>
:root {
  --bg: #f1e8d5; --panel: #e8dcc2; --panel-2: #dfd0b0; --fg: #3a2c1c; --muted: #7a6850; --line: #bfa97f;
  --accent: #a4481f; --accent-fg: #fff6e8; --hud: rgba(241,232,213,.9); --ring: #6a5330; --good: #4f8a38; --bad: #b8433a;
  --game-bg: #0b0d16;
  /* everything pinned to a screen edge keeps clear of a phone's system bars */
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: 0px; --sar: 0px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1710; --panel: #2a2217; --panel-2: #342a1c; --fg: #ecdfc4; --muted: #a8977a; --line: #4d3f29;
  --accent: #e08a52; --accent-fg: #26180c; --hud: rgba(29,23,16,.9); --ring: #8a7048; --good: #7ac15c; --bad: #e0705f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1d1710; --panel: #2a2217; --panel-2: #342a1c; --fg: #ecdfc4; --muted: #a8977a; --line: #4d3f29;
  --accent: #e08a52; --accent-fg: #26180c; --hud: rgba(29,23,16,.9); --ring: #8a7048; --good: #7ac15c; --bad: #e0705f; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--game-bg); color: var(--fg); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 13px; line-height: 1.35; user-select: none; -webkit-user-select: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; cursor: crosshair; image-rendering: pixelated; }

button { font: inherit; font-weight: 600; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; min-height: 30px; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.sm { padding: 2px 8px; min-height: 26px; }
@media (pointer: coarse) { button { min-height: 38px; padding: 6px 11px; } button.sm { min-height: 32px; } }

/* top bar */
.top { position: absolute; left: calc(6px + var(--sal)); right: calc(6px + var(--sar)); top: calc(6px + var(--sat)); display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; pointer-events: none; }
.top > * { pointer-events: auto; }
.hud { background: var(--hud); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; backdrop-filter: blur(2px); display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
.res { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; }
.res i { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); display: inline-block; }
.res small { font-weight: 500; color: var(--muted); }
.res.full b { color: var(--accent); }
.res.warn small { color: var(--accent); font-weight: 700; }
.clock { font-weight: 600; }
.grp { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.spacer { flex: 1; }

/* bottom-left sheet */
.sheet { position: absolute; left: calc(6px + var(--sal)); bottom: calc(6px + var(--sab)); width: min(440px, calc(100% - 130px)); max-height: calc(100% - var(--top-h, 44px) - 14px); overflow: auto; display: grid; gap: 6px; pointer-events: none; align-content: end; }
.sheet > * { pointer-events: auto; }
.card { background: var(--hud); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; backdrop-filter: blur(2px); display: grid; gap: 5px; }
.cardhead { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.cardhead b { font-size: 14px; }
.cardhead span { color: var(--muted); }
.cardhead .x { margin-left: auto; align-self: center; }
.kv { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: 12px; }
.kv b { color: var(--fg); font-variant-numeric: tabular-nums; }
.stars { color: var(--accent); letter-spacing: 1px; }
.bars { display: grid; grid-template-columns: repeat(3, minmax(60px, 1fr)); gap: 4px 10px; }
.bars label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
.bars i { display: block; height: 7px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); overflow: hidden; }
.bars i b { display: block; height: 100%; width: 0; background: var(--good); transition: width .2s; }
.bars i b.bad { background: var(--bad); }
.bars i b.mor { background: #6d8fd8; }
.btns { display: flex; flex-wrap: wrap; gap: 4px; }
.sub { color: var(--muted); font-size: 12px; margin: 0; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 600; padding: 2px 0; }
details.fold { border-top: 1px solid var(--line); padding-top: 2px; display: block; }
details.fold > .btns, details.fold > .kv { margin-top: 4px; }
.selbar { display: flex; gap: 4px; flex-wrap: wrap; }
.sheet.folded > .card { display: none; }

/* lists */
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .nm { font-weight: 600; }
.row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.rec { display: grid; grid-template-columns: 32px 1fr auto; gap: 8px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
.rec canvas { width: 32px; height: 32px; image-rendering: pixelated; }
.rec .qty { display: inline-flex; gap: 4px; align-items: center; font-variant-numeric: tabular-nums; }
.rec.locked, .tech.locked { opacity: .55; }
.tech { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 4px 0; border-top: 1px solid var(--line); }
.tech .nm { font-weight: 600; }
.tech .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.tech.done .nm { color: var(--good); }
.lock { display: block; color: var(--bad); }
button.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.rec .have { min-width: 9ch; text-align: right; color: var(--muted); font-size: 12px; }
.vrow { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); cursor: pointer; }
.vrow small { color: var(--muted); }
.tribe-bar { height: 6px; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--line); position: relative; overflow: hidden; }
.tribe-bar b { position: absolute; top: 0; bottom: 0; background: var(--accent); }
.tribe-bar u { position: absolute; top: -1px; bottom: -1px; width: 2px; background: var(--fg); left: 50%; opacity: .5; }

/* minimap, log, toast */
#mini { position: absolute; right: calc(6px + var(--sar)); bottom: calc(6px + var(--sab)); width: clamp(64px, 15vw, 96px); aspect-ratio: 1; image-rendering: pixelated; border: 2px solid var(--ring); border-radius: 6px; background: #080a14; cursor: zoom-in; }
.log { position: absolute; right: calc(6px + var(--sar)); bottom: calc(clamp(64px, 15vw, 96px) + 14px + var(--sab)); max-width: min(330px, 46%); text-align: right; font-size: 12px; line-height: 1.35; color: #f5e7c4; text-shadow: 0 1px 2px #000, 0 0 4px #000; pointer-events: none; display: grid; gap: 2px; }
.toast { position: absolute; left: 50%; top: calc(52px + var(--sat)); transform: translateX(-50%); background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 5px 12px; border-radius: 16px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: 90%; text-align: center; z-index: 50; }
.toast.on { opacity: 1; }
#bigmap { position: fixed; inset: 0; background: rgba(5,6,12,.88); z-index: 45; display: grid; place-items: center; }
#bigmap .wrap { position: relative; width: min(94vh, 94vw); aspect-ratio: 1; }
#bigmapCanvas { width: 100%; height: 100%; image-rendering: pixelated; border: 2px solid var(--ring); border-radius: 6px; background: #080a14; cursor: crosshair; touch-action: none; }
#bigmap .note { position: absolute; left: 8px; bottom: 8px; color: #f5e7c4; text-shadow: 0 1px 2px #000; font-size: 12px; pointer-events: none; }
#bigmap .close { position: absolute; right: 8px; top: 8px; }

/* menu drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(390px, 94vw); background: var(--bg); border-left: 2px solid var(--ring); z-index: 40; display: flex; flex-direction: column; padding-top: var(--sat); padding-bottom: var(--sab); }
#drawer .head { display: flex; gap: 4px; padding: 6px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--panel); }
#drawer .body { overflow: auto; padding: 8px; display: grid; gap: 8px; align-content: start; flex: 1; }
#drawer h3 { margin: 4px 0 0; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
#drawer .help { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; }
#drawer .help b { color: var(--fg); }
.devrow { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.devrow > span { min-width: 7ch; font-weight: 600; }
.devrow b { min-width: 2.5ch; text-align: center; font-variant-numeric: tabular-nums; }

@media (max-width: 760px) { .log { display: none; } }
@media (max-height: 480px) {
  body { font-size: 12px; }
  .top { gap: 4px; left: calc(4px + var(--sal)); right: calc(4px + var(--sar)); top: calc(4px + var(--sat)); }
  .hud { padding: 2px 6px; gap: 2px 8px; }
  .sheet { max-height: min(60%, calc(100% - var(--top-h, 40px) - 10px)); width: min(340px, calc(100% - 120px)); left: calc(4px + var(--sal)); bottom: calc(4px + var(--sab)); }
  .card { padding: 4px 6px; gap: 3px; }
  #mini { right: calc(4px + var(--sar)); bottom: calc(4px + var(--sab)); width: clamp(56px, 12vw, 84px); }
  .log { bottom: calc(clamp(56px, 12vw, 84px) + 10px + var(--sab)); right: calc(4px + var(--sar)); }
  .toast { top: calc(40px + var(--sat)); }
}
</style>

<div id="app">
  <canvas id="view" tabindex="0" aria-label="Bản đồ làng"></canvas>

  <div class="top">
    <div class="hud" id="resBar">
      <span class="res" id="rFood" title="Thức ăn"><i style="background:#c2573a"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rWood" title="Gỗ"><i style="background:#9a6a35"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rStone" title="Đá"><i style="background:#9aa0a4"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rHide" title="Da và xương"><i style="background:#a0552f"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rPop" title="Số dân"><i style="background:#e8c4a0"></i><b>0</b><small>/40</small></span>
    </div>
    <div class="hud grp" role="group" aria-label="Tốc độ game">
      <button class="sm" data-speed="0" aria-pressed="false" title="Tạm dừng (P)">❚❚</button>
      <button class="sm" data-speed="1" aria-pressed="true" title="Tốc độ 1× (Q)">1×</button>
      <button class="sm" data-speed="2" aria-pressed="false" title="Tốc độ 2× (E)">2×</button>
      <button class="sm" data-speed="4" aria-pressed="false" title="Tốc độ 4× (R)">4×</button>
    </div>
    <div class="hud" id="clockLine"><span class="clock" id="clock">Ngày 1</span></div>
    <span class="spacer"></span>
    <button id="btnMenu" class="primary" title="Menu (Tab)">☰ Menu</button>
  </div>

  <div class="log" id="log" aria-live="polite"></div>
  <canvas id="mini" aria-label="Bản đồ nhỏ, bấm để mở bản đồ lớn" title="Bấm để mở bản đồ lớn"></canvas>
  <div class="toast" id="toast" role="status"></div>

  <div class="sheet" id="sheet">
    <div class="card" id="placeBar" hidden>
      <div class="cardhead"><b id="placeName"></b><span id="placeInfo"></span></div>
      <p class="sub">Kéo hoặc chạm để chọn chỗ (ô xanh là đặt được).</p>
      <div class="btns"><button id="btnPlaceOk" class="primary">✓ Đặt ở đây</button><button id="btnPlaceNo">✕ Hủy</button></div>
    </div>
    <div class="card" id="bpanel" hidden></div>
    <div class="card" id="tcard" hidden></div>
    <div class="card" id="ucard" hidden></div>
    <div class="selbar">
      <button id="btnMulti" aria-pressed="false" title="Bật để chạm từng dân hoặc kéo khung chọn nhiều dân">Chọn nhiều</button>
      <button id="btnAll" title="Chọn tất cả dân (Ctrl+A)">Chọn hết</button>
      <button id="btnNone" title="Bỏ chọn (Esc)">Bỏ chọn</button>
      <button id="btnFold" aria-pressed="false" title="Ẩn các bảng thông tin để thấy rõ bản đồ">Ẩn bảng</button>
    </div>
  </div>

  <div id="bigmap" hidden>
    <div class="wrap">
      <canvas id="bigmapCanvas"></canvas>
      <button class="close" id="btnCloseMap">✕ Đóng</button>
      <div class="note">Chạm vào bản đồ để nhảy tới đó</div>
    </div>
  </div>

  <aside id="drawer" hidden>
    <div class="head" id="drawerTabs"></div>
    <div class="body" id="drawerBody"></div>
  </aside>
</div>
<script>"use strict";
(() => {
  // src/sim/buildings.ts
  var ERAS = ["stone", "ancient"];
  var lv = (name, cost, buildTime, cap = 0, craftSpeed = 1) => ({ name, cost, buildTime, cap, craftSpeed });
  var BUILDINGS = {
    campfire: { kind: "campfire", name: "Nh\xE0 chung (\u0111\u1ED1ng l\u1EEDa tr\u1EA1i)", w: 2, h: 2, buildable: false, levels: { stone: [lv("L\u1EEDa tr\u1EA1i", {}, 0, 50)] } },
    workshop: {
      kind: "workshop",
      name: "X\u01B0\u1EDFng ch\u1EBF t\xE1c",
      w: 2,
      h: 2,
      buildable: true,
      levels: { stone: [lv("\u0110\u01A1n s\u01A1", { wood: 15 }, 30, 0, 1), lv("G\u1ED7", { wood: 15, stone: 30 }, 60, 0, 1.25), lv("\u0110\xE1", { wood: 30, stone: 50 }, 90, 0, 1.5)] }
    },
    storage: {
      kind: "storage",
      name: "Kho",
      w: 2,
      h: 2,
      buildable: true,
      levels: { stone: [lv("\u0110\u01A1n s\u01A1", { wood: 10 }, 20, 100), lv("G\u1ED7", { wood: 35 }, 40, 250), lv("\u0110\xE1", { wood: 40, stone: 20 }, 60, 500)] }
    }
  };
  function levelsOf(kind, era) {
    const defs = BUILDINGS[kind].levels;
    for (let i = ERAS.indexOf(era); i >= 0; i--) {
      const l = defs[ERAS[i]];
      if (l) return l;
    }
    return defs.stone;
  }
  var levelDef = (b, level = b.level) => levelsOf(b.kind, b.era)[level - 1];
  var maxLevel = (kind, era) => levelsOf(kind, era).length;
  var needsWork = (b) => !b.done || b.upgrading;

  // src/sim/constants.ts
  var TILE = 32;
  var MAP_SIZE = 192;
  var VISION = 7;
  var NIGHT_VISION = 3;
  var FIRE_VISION = 8;
  var TICK = 1 / 20;
  var DAY_LENGTH = 240;
  var START_TIME = DAY_LENGTH * 0.25;

  // src/sim/rng.ts
  function mulberry32(seed2) {
    let a = seed2 >>> 0;
    return () => {
      a = a + 1831565813 >>> 0;
      let t = a;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash2(x, y, seed2) {
    let h2 = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(seed2 | 0, 1274126177);
    h2 = Math.imul(h2 ^ h2 >>> 13, 1274126177);
    h2 ^= h2 >>> 16;
    return (h2 >>> 0) / 4294967296;
  }
  var smooth = (t) => t * t * (3 - 2 * t);
  function valueNoise(x, y, seed2) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = smooth(x - ix), fy = smooth(y - iy);
    const a = hash2(ix, iy, seed2), b = hash2(ix + 1, iy, seed2);
    const c = hash2(ix, iy + 1, seed2), d = hash2(ix + 1, iy + 1, seed2);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  }
  function fbm(x, y, seed2, octaves = 3) {
    let sum = 0, amp = 1, norm = 0, f = 1;
    for (let o = 0; o < octaves; o++) {
      sum += valueNoise(x * f, y * f, seed2 + o * 101) * amp;
      norm += amp;
      amp *= 0.5;
      f *= 2;
    }
    return sum / norm;
  }

  // src/sim/world.ts
  var Tile = { Grass: 0, Water: 1, Tree: 2, Rock: 3, Mud: 4, Bush: 5 };
  var NODE_INFO = {
    tree: { res: "wood", max: 10 },
    rock: { res: "stone", max: 14 },
    bush: { res: "food", max: 6 }
  };
  var TILE_OF = { tree: Tile.Tree, rock: Tile.Rock, bush: Tile.Bush };
  var World = class {
    constructor(seed2) {
      this.seed = seed2;
      this.size = MAP_SIZE;
      this.tiles = new Uint8Array(MAP_SIZE * MAP_SIZE);
      this.occ = new Uint8Array(MAP_SIZE * MAP_SIZE);
      // ô bị công trình chiếm
      this.decor = new Uint8Array(MAP_SIZE * MAP_SIZE);
      // 1 = gốc cây
      this.nodes = /* @__PURE__ */ new Map();
      this.start = { x: MAP_SIZE >> 1, y: MAP_SIZE >> 1 };
      this.season = "spring";
      const N = this.size;
      for (let y = 0; y < N; y++) {
        for (let x = 0; x < N; x++) {
          const d = Math.hypot(x - this.start.x, y - this.start.y);
          const elev = fbm(x / 26, y / 26, seed2);
          const forest = fbm(x / 10, y / 10, seed2 + 7);
          let t = Tile.Grass;
          if (elev < 0.34 && d > 14) t = Tile.Water;
          else if (d > 6 && forest > 0.58 && hash2(x, y, seed2 + 3) < 0.5) t = Tile.Tree;
          else if (d > 5 && hash2(x, y, seed2 + 9) < 0.012) t = Tile.Rock;
          else if (d > 4 && hash2(x, y, seed2 + 13) < 0.012) t = Tile.Bush;
          else if (d > 8 && hash2(x, y, seed2 + 5) < 0.01) t = Tile.Tree;
          this.tiles[y * N + x] = t;
        }
      }
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        if (this.tiles[y * N + x] !== Tile.Grass) continue;
        let near2 = false;
        for (let dy = -1; dy <= 1 && !near2; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && ny >= 0 && nx < N && ny < N && this.tiles[ny * N + nx] === Tile.Water) {
            near2 = true;
            break;
          }
        }
        if (near2 && hash2(x, y, seed2 + 17) < 0.8) this.tiles[y * N + x] = Tile.Mud;
      }
      this.ensureNearStart("tree", 12, 6, 17, seed2 + 101);
      this.ensureNearStart("rock", 5, 6, 15, seed2 + 102);
      this.ensureNearStart("bush", 8, 5, 14, seed2 + 103);
      for (let i = 0; i < this.tiles.length; i++) {
        const t = this.tiles[i];
        const kind = t === Tile.Tree ? "tree" : t === Tile.Rock ? "rock" : t === Tile.Bush ? "bush" : null;
        if (kind) this.nodes.set(i, { kind, res: NODE_INFO[kind].res, amount: NODE_INFO[kind].max, max: NODE_INFO[kind].max, workers: 0, sides: 0, regrow: 0 });
      }
    }
    /** Bảo đảm có tối thiểu `count` nguồn loại `kind` quanh điểm khởi đầu. */
    ensureNearStart(kind, count, rMin, rMax, seed2) {
      const N = this.size, tile = TILE_OF[kind], rnd = mulberry32(seed2);
      let have = 0;
      for (let y = this.start.y - rMax; y <= this.start.y + rMax; y++) for (let x = this.start.x - rMax; x <= this.start.x + rMax; x++) {
        const d = Math.hypot(x - this.start.x, y - this.start.y);
        if (d >= rMin && d <= rMax && this.tiles[y * N + x] === tile) have++;
      }
      for (let tries = 0; have < count && tries < 600; tries++) {
        const a = rnd() * Math.PI * 2, r = rMin + rnd() * (rMax - rMin);
        const x = Math.round(this.start.x + Math.cos(a) * r), y = Math.round(this.start.y + Math.sin(a) * r);
        if (this.tiles[y * N + x] === Tile.Grass) {
          this.tiles[y * N + x] = tile;
          have++;
        }
      }
    }
    inBounds(x, y) {
      return x >= 0 && y >= 0 && x < this.size && y < this.size;
    }
    at(x, y) {
      return this.tiles[y * this.size + x];

    $("rPop").querySelector("b").textContent = String(sim.villagers.length);
    $("rPop").querySelector("small").textContent = `/${POP_CAP}`;
    for (const r of RES_LIST) void RES_NAME[r];
    const se = SEASON_DEF[sim.season], we = WEATHER[sim.weather], year = yearOf(sim.day);
    clock.textContent = `${year > 1 ? `N\u0103m ${year} \xB7 ` : ""}Ng\xE0y ${sim.day} \xB7 ${se.name} ${dayInSeason(sim.day)}/${SEASON_DAYS} \xB7 ${DAY_PART_NAME[sim.part]} \xB7 ${we.name}`;
    const eff = [we.vision ? `t\u1EA7m nh\xECn \u2212${we.vision} \xF4` : "", we.speed < 1 ? `\u0111i ch\u1EADm ${Math.round((1 - we.speed) * 100)}%` : ""].filter(Boolean).join(", ");
    $("clockLine").title = `${we.name}${eff ? `: ${eff}` : ""}. H\xE1i l\u01B0\u1EE3m m\xF9a ${se.name.toLowerCase()} \xD7${se.gather.toLocaleString("vi")}. ${Math.round(fps)} fps`;
    const lines = sim.log.slice(-4), lk = lines.map((l) => l.text).join("|");
    if (lk !== logKey) {
      if (logKey && innerWidth < 760 && lines.length) toast(lines[lines.length - 1].text);
      logKey = lk;
      log.replaceChildren(...lines.map((l) => {
        const d = document.createElement("div");
        d.textContent = l.text;
        return d;
      }));
    }
    const topH = Math.ceil(topBar.getBoundingClientRect().height);
    if (topH !== lastTopH) {
      lastTopH = topH;
      document.documentElement.style.setProperty("--top-h", `${topH}px`);
    }
    if (sim.pendingTribe !== pending) {
      pending = sim.pendingTribe;
      if (pending) {
        menu.open("tribes");
        toast("M\u1ED9t b\u1ED9 t\u1ED9c xin h\xE0ng!");
      }
    }
    const chosen = sim.villagers.filter((v) => ctl.selected.has(v.id));
    const placing = !!ctl.placing, showB = ctl.selectedBuilding !== null && !placing;
    buildingPanel.update();
    unitCard.update(chosen);
    targetCard.update();
    if (placing || !showB) $("bpanel").hidden = true;
    if (placing || showB) $("ucard").hidden = true;
    if (placing || showB) $("tcard").hidden = true;
    const bar = $("placeBar");
    bar.hidden = !placing;
    if (placing && ctl.placing) {
      const why = ctl.placeProblem(), moving = ctl.moving !== null ? sim.getBuilding(ctl.moving) : void 0;
      $("placeName").textContent = `${moving ? "D\u1EDDi" : "\u0110\u1EB7t"} ${BUILDINGS[ctl.placing].name}`;
      $("placeInfo").textContent = why ?? (moving ? `Ph\xED d\u1EDDi: ${costText(sim.moveFee(moving), RES_NAME)}` : "Ch\u1ED7 n\xE0y \u0111\u1EB7t \u0111\u01B0\u1EE3c");
      $("btnPlaceOk").disabled = why !== null;
      $("btnPlaceOk").textContent = moving ? "\u2713 D\u1EDDi t\u1EDBi \u0111\xE2y" : "\u2713 \u0110\u1EB7t \u1EDF \u0111\xE2y";
    }
    menu.update();
    syncButtons();
  }
  ctl.onChange = () => {
    lastHud = 0;
    syncButtons();
  };
  var last = 0;
  function frame(t) {
    const dt = last ? (t - last) / 1e3 : 0;
    last = t;
    if (dt > 0) fps = fps * 0.9 + 1 / dt * 0.1;
    ctl.update(dt);
    sim.advance(dt);
    renderer.draw(t / 1e3, ctl.selected, ctl.box, ctl.markers, ctl.ghost(), ctl.selectedBuilding, ctl.inspect);
    map.draw();
    updateHud(t);
    requestAnimationFrame(frame);
  }
  new ResizeObserver(() => {
    renderer.resize();
    ctl.clamp();
  }).observe(view);
  requestAnimationFrame(frame);
  window.__game = { sim, cam, ctl, renderer, menu, map, research: RESEARCH };
})();
</script>
