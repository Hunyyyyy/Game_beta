<style>
  body { margin: 0; padding: 14px 16px; background: #c4b280; font: 14px system-ui, sans-serif; color: #2b1d0e; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0 10px 0 0; }
  label { display: inline-flex; align-items: center; gap: 5px; }
  select, input { font: inherit; }
  .unit { margin-bottom: 18px; padding: 8px 10px; background: rgba(255, 255, 255, .22); border: 1px solid #8a6a36; border-radius: 10px; }
  .unit h2 { margin: 0 0 6px; font-size: 16px; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  figure { margin: 0; text-align: center; }
  figcaption { font-weight: 700; margin-top: 2px; }
  canvas { image-rendering: pixelated; display: block; }
</style></head>

        cv.style.height = cv.height * state.scale + "px";
        cell.append(cv);
        const cap = document.createElement("figcaption");
        cap.textContent = label;
        cell.append(cap);
        acts.append(cell);
        cards.push({ u, a, cv, ctx: cv.getContext("2d") });
      }
      root.append(card);
    }
  }
  var t0 = performance.now();
  var last = 0;
  function tick(now) {
    if (!state.pause) last = (now - t0) / 1e3;
    for (const c of cards) {
      const an = anims_default[state.alt && c.u.alt && c.u.alt[c.a] || c.u.anims[c.a]];
      const len = an.frames.length / (an.fps * state.speed), t = an.loop === false ? last % (len + 0.6 / state.speed) : last;
      const p = pic(c.u, c.a, t);
      c.ctx.clearRect(0, 0, c.cv.width, c.cv.height);
      c.ctx.putImageData(new ImageData(new Uint8ClampedArray(p.px), p.w, p.h), 0, 0);
    }
    requestAnimationFrame(tick);
  }
  $("scale").onchange = () => {
    state.scale = Number($("scale").value);
    build();
  };
  $("speed").onchange = () => {
    state.speed = Number($("speed").value);
  };
  $("left").onchange = () => {
    state.left = $("left").checked;
  };
  $("alt").onchange = () => {
    state.alt = $("alt").checked;
  };
  $("pause").onchange = () => {
    state.pause = $("pause").checked;
  };
  $("bg").onchange = () => {
    document.body.style.background = $("bg").value;
  };
  build();
  requestAnimationFrame(tick);
})();
</script>
</body></html>
