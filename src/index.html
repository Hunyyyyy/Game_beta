<title>Làng Đồ Đá</title>
<style>/*STYLE*/</style>

<div id="app">
  <canvas id="view" tabindex="0" aria-label="Bản đồ làng"></canvas>

  <div class="top">
    <div class="hud" id="resBar">
      <span class="res" id="rFood" title="Thức ăn"><i style="background:#c2573a"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rWood" title="Gỗ"><i style="background:#9a6a35"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rStone" title="Đá"><i style="background:#9aa0a4"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rHide" title="Da"><i style="background:#a0552f"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rBone" title="Xương" hidden><i style="background:#e4dcc4"></i><b>0</b></span>
      <span class="res" id="rFat" title="Mỡ" hidden><i style="background:#f0e2b0"></i><b>0</b></span>
      <span class="res" id="rFeather" title="Lông vũ" hidden><i style="background:#7aa0c8"></i><b>0</b></span>
      <span class="res" id="rTusk" title="Ngà" hidden><i style="background:#fff6e0"></i><b>0</b></span>
      <span class="res" id="rTorch" title="Đuốc trong kho" hidden><i style="background:#f89628;border-radius:2px 2px 0 0"></i><b>0</b></span>
      <span class="res" id="rCoin" title="Tiền"><i style="background:#e8e0c8;border-radius:50%"></i><b>0</b><small>/0</small></span>
      <span class="res" id="rPop" title="Số dân"><i style="background:#e8c4a0"></i><b>0</b><small>/40</small></span>
    </div>
    <div class="hud grp" role="group" aria-label="Tốc độ game">
      <button class="sm" data-speed="0" aria-pressed="false" title="Tạm dừng (P)">❚❚</button>
      <button class="sm" data-speed="1" aria-pressed="true" title="Tốc độ 1× (Q)">1×</button>
      <button class="sm" data-speed="2" aria-pressed="false" title="Tốc độ 2× (E)">2×</button>
      <button class="sm" data-speed="4" aria-pressed="false" title="Tốc độ 4× (R)">4×</button>
      <button class="sm" data-speed="16" aria-pressed="false" title="Tốc độ 16× (T)">16×</button>
    </div>
    <div class="hud" id="clockLine"><span class="clock" id="clock">Ngày 1</span></div>
    <span class="spacer"></span>
    <button id="btnFull" title="Toàn màn hình và khóa ngang" aria-pressed="false">⛶</button>
    <button id="btnBuild" class="primary" title="Xây dựng (B)">🔨 Xây</button>
    <button id="btnMenu" title="Menu (Tab)">☰ Menu</button>
  </div>

  <div class="log" id="log" aria-live="polite"></div>
  <canvas id="mini" aria-label="Bản đồ nhỏ, bấm để mở bản đồ lớn" title="Bấm để mở bản đồ lớn"></canvas>
  <div class="toast" id="toast" role="status"></div>

  <div class="bbar" id="bbar" hidden></div>
  <div class="tray" id="tray" hidden></div>
  <div class="modal" id="bpanel" hidden></div>
  <div class="dialog" id="dialog" hidden></div>
  <div class="dialog" id="start" hidden></div>
  <div class="modal" id="udetail" hidden></div>

  <div class="warbar" id="warbar" hidden></div>

  <div class="sheet" id="sheet">
    <div class="card" id="placeBar" hidden>
      <div class="hint">
        <div class="cardhead"><b id="placeName"></b><span id="placeInfo"></span><button class="q" type="button" aria-label="Hướng dẫn" aria-expanded="false">?</button></div>
        <p class="sub hintbody" hidden>Kéo hoặc chạm để chọn chỗ (ô xanh là đặt được).</p>
      </div>
      <div class="btns"><button id="btnPlaceOk" class="primary">✓ Đặt ở đây</button><button id="btnPlaceNo">✕ Hủy</button></div>
    </div>
    <div class="card" id="tcard" hidden></div>
    <div class="card" id="ucard" hidden></div>
    <div class="selbar">
      <button id="btnMulti" aria-pressed="false" title="Bật để chạm từng dân hoặc kéo khung chọn nhiều dân">Chọn nhiều</button>
      <button id="btnAll" title="Chọn tất cả dân (Ctrl+A)">Chọn hết</button>
      <button id="btnNone" title="Bỏ chọn (Esc)">Bỏ chọn</button>
      <button id="btnFold" aria-pressed="false" title="Ẩn các bảng thông tin để thấy rõ bản đồ">Ẩn bảng</button>
    </div>
  </div>

  <div id="rotate" hidden>
    <div class="phone" aria-hidden="true"></div>
    <b>Xoay ngang điện thoại</b>
    <p>Chơi ngang cho màn hình rộng hơn. Game đang tạm dừng.</p>
    <button id="btnRotateFull" class="primary">Toàn màn hình và khóa ngang</button>
    <button id="btnRotateSkip">Cứ chơi dọc</button>
  </div>

  <div id="bigmap" hidden>
    <div class="wrap">
      <canvas id="bigmapCanvas"></canvas>
      <button class="close" id="btnCloseMap">✕ Đóng</button>
      <div class="hint maphint"><button class="q" type="button" aria-label="Hướng dẫn" aria-expanded="false">?</button><p class="sub hintbody" hidden>Chạm vào bản đồ để nhảy tới đó.</p></div>
    </div>
  </div>

  <aside id="drawer" hidden>
    <div class="head" id="drawerTabs"></div>
    <div class="body" id="drawerBody"></div>
  </aside>
</div>
<script>/*BUNDLE*/</script>
